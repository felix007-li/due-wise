services:
  db:
    image: postgres:16.11-alpine
    environment:
      POSTGRES_DB: duewise
      POSTGRES_USER: duewise
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - duewise_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duewise"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  duewise_db:
