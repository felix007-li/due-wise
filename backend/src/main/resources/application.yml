spring:
  application:
    name: duewise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duewise}
    username: ${DB_USER:duewise}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_SECURE:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
