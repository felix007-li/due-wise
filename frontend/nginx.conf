server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/security-headers.conf;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control no-store always;
    }
    location /assets/ { include /etc/nginx/security-headers.conf; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /sw.js { include /etc/nginx/security-headers.conf; add_header Cache-Control no-cache; }
    location / { include /etc/nginx/security-headers.conf; try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
